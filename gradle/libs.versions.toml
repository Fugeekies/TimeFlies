# Versions stables figées au jalon 1 (14/11/2026), toutes publiées depuis au moins deux semaines.
[versions]
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
compose-hot-reload = "1.2.0"
android-gradle-plugin = "9.5.0"
androidx-activity = "1.13.0"
kotlinx-coroutines = "1.11.0"

android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "compose-hot-reload" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }

# Release of TimeFlies (docs/ARCHITECTURE.md, "Distribution"), started by hand from the Actions tab as for
# LMU-DeltaRacing: the next version is computed from the latest vX.Y.Z tag, the Android APK and the Windows
# installer are built, then the tag and the GitHub release are created with both files.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de version à publier (incrémente le dernier tag vX.Y.Z)"
        required: true
        type: choice
        default: Mineur
        options:
          - Majeur
          - Mineur
          - Patch
      publish:
        description: "Publier la release (décoché : fichiers en artefacts seulement, pour essayer)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# Two releases started in a row would compute the same next version from the same latest tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Tags are needed to find the latest version

      - name: Version suivante
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$PUBLISH" == "true" && "$REF" != "refs/heads/main" ]]; then
            echo "::error::Une release se publie depuis main seulement (branche choisie : $REF)."
            exit 1
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -n "$latest" ]]; then
            IFS=. read -r major minor patch <<< "${latest#v}"
          else
            major=0; minor=0; patch=0
          fi
          case "$BUMP" in
            Majeur) major=$((major + 1)); minor=0; patch=0 ;;
            Mineur) minor=$((minor + 1)); patch=0 ;;
            Patch) patch=$((patch + 1)) ;;
            *) echo "::error::Type de version inconnu : $BUMP"; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          echo "Dernier tag : ${latest:-aucun} -> v$version ($BUMP)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest" >> "$GITHUB_OUTPUT"

  android:
    name: APK Android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Plateforme Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      # A release never ships with a red test.
      - name: Tests (dont la validation des fichiers d'événements)
        run: ./gradlew check --console=plain

      # The stable key lives in the repository secrets only, never in the code (AGENTS.md, "Distribution").
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : l'APK ne peut pas être signée (docs/DEVELOPMENT.md, « Releases »)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: APK signée
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew :androidApp:assembleRelease "-Ptimeflies.version=$VERSION" --console=plain
          mkdir -p output
          cp src/androidApp/build/outputs/apk/release/androidApp-release.apk "output/TimeFlies-$VERSION.apk"

      - name: Vérification de la signature
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "output/TimeFlies-$VERSION.apk" | grep "certificate SHA-256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: TimeFlies-apk
          path: output/TimeFlies-*.apk
          if-no-files-found: error

  windows:
    name: Installeur Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1

      # jpackage app folder with its own Java, no WiX needed.
      - name: Dossier de l'application
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew :desktopApp:createDistributable "-Ptimeflies.version=$env:VERSION" --console=plain

      - name: Vérification du dossier
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $folder = "src/desktopApp/build/compose/binaries/main/app/TimeFlies"
          if (-not (Test-Path "$folder/TimeFlies.exe")) { throw "TimeFlies.exe manque dans $folder" }
          $cfg = Get-Content "$folder/app/TimeFlies.cfg" -Raw
          if ($cfg -notmatch [regex]::Escape("-Dtimeflies.version=$env:VERSION")) { throw "La version $env:VERSION manque dans TimeFlies.cfg" }

      - name: Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Installeur
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          iscc "/DAppVersion=$env:VERSION" "scripts/installer.iss"
          Move-Item output/TimeFlies-Setup.exe "output/TimeFlies-$env:VERSION-Setup.exe"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: TimeFlies-setup
          path: output/TimeFlies-*-Setup.exe
          if-no-files-found: error

  release:
    name: Publication
    needs: [version, android, windows]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates the tag and the release
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.2
        with:
          path: output
          merge-multiple: true

      - name: Notes de version à partir des PR fusionnées
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
          RELEASE_TAG: v${{ needs.version.outputs.version }}
        run: |
          range="HEAD"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            range="$PREVIOUS_TAG..HEAD"
          fi
          # Squash merges end with "(#N)", merge commits start with "Merge pull request #N".
          numbers=$(git log --first-parent --format=%s "$range" |
            sed -nE 's/.*\(#([0-9]+)\)$/\1/p; s/^Merge pull request #([0-9]+).*/\1/p')
          {
            echo "## Installation"
            echo
            echo "- **Android** : télécharge \`TimeFlies-${RELEASE_TAG#v}.apk\` depuis le téléphone et ouvre-le (autorise l'installation d'applications inconnues si Android le demande)."
            echo "- **Windows** : télécharge et lance \`TimeFlies-${RELEASE_TAG#v}-Setup.exe\` ; si Windows affiche « Windows a protégé votre ordinateur », clique sur « Informations complémentaires » puis « Exécuter quand même » (l'installeur n'est pas signé)."
            echo
            echo "Une nouvelle version s'installe par-dessus l'ancienne et garde tes réglages."
            echo
            echo "## Changements"
            echo
            if [[ -z "$numbers" ]]; then
              echo "Aucune PR fusionnée depuis la version précédente."
            else
              for number in $numbers; do
                gh pr view "$number" --json number,title --template '- {{.title}} (#{{.number}}){{"\n"}}'
              done
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Tous les changements :** https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$RELEASE_TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Tag et release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" output/* --title "TimeFlies $RELEASE_TAG" --notes-file release-notes.md
